name: '🔨 Refactor'
description: '구조 개선, 코드 정리, 유지보수성 향상이 필요한 작업을 기록합니다.'
title: '[Refactor]: '
labels: 'refactor'
body:
  - type: textarea
    id: problem
    attributes:
      label: 현재 문제점
      description: 무엇이 왜 문제인지 작성해 주세요.
      placeholder: 예) 검사 결과 화면의 상태 분기가 흩어져 있어 수정 시 회귀 위험이 큽니다.
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: 리팩터링 대상
      description: 파일, 컴포넌트, 로직, 문서 등 구체적인 대상을 작성해 주세요.
      placeholder: 예) 결과 카드 컴포넌트, URL 검사 상태 처리 로직
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 항목
      description: 해야 하는 일을 최대한 세분화해서 작성해 주세요.
      placeholder: |-
        - 공통 로직 분리
        - 중복 UI 제거
        - 관련 문서 업데이트
    validations:
      required: true
  - type: textarea
    id: etc
    attributes:
      label: 참고 자료
      description: 더 전달할 내용이 있다면 작성해 주세요.
